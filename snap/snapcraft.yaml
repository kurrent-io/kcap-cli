name: kcap
title: Kurrent Capacitor
summary: Record, review and run coding-agent sessions
description: |
  Kurrent Capacitor records coding-agent sessions (Claude Code, Codex, Cursor and others) to a
  Capacitor server, runs agents remotely through a local daemon, and gives pull-request reviews
  the context of the sessions that produced them.

  This snap ships the Kurrent Capacitor desktop app together with the `kcap` CLI and daemon it
  drives, so the two always match.
adopt-info: kcap
base: core26
grade: devel
# Classic: kcap runs the agent CLIs installed on the host, reads and writes their session and
# hook files under the home directory, works in repositories anywhere on disk, and manages its
# daemon through `systemctl --user`.
confinement: classic

platforms:
  amd64:

apps:
  kcap:
    command: bin/kcap
  desktop:
    command: bin/kurrent-capacitor

parts:
  kcap:
    # Prebuilt by scripts/build-snap.sh: the same self-contained publishes the other platforms ship.
    plugin: dump
    source: build/snap
    override-build: |
      craftctl default
      craftctl set version="$(cat "$CRAFT_PART_SRC/VERSION")"
    stage:
      - -VERSION
