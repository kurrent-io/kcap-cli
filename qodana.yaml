####################################################################################################################
# WARNING: Do not store sensitive information in this file, as its contents will be included in the Qodana report. #
####################################################################################################################

version: "1.0"
linter: qodana-dotnet
# Analyze with the SDK CI builds with, not the image's: same resolution as .github/actions/setup-dotnet
bootstrap: >-
  channel=$(sed -n 's/.*"version": *"\([0-9]*\.[0-9]*\)\..*/\1/p' /data/project/global.json | head -n 1) &&
  version=$(curl -fsSL --retry 3 "https://builds.dotnet.microsoft.com/dotnet/release-metadata/$channel/releases.json"
  | grep -o '"latest-sdk": *"[^"]*"' | head -n 1 | sed 's/.*"\([^"]*\)"$/\1/') &&
  curl -fsSL https://dot.net/v1/dotnet-install.sh | bash -s -- --version "$version" -i /usr/share/dotnet
dotnet:
  solution: Capacitor.slnx
profile:
  name: qodana.recommended
include:
  - name: CheckDependencyLicenses
exclude:
  # .editorconfig already settles these: no XML docs are published, IDE0055 stays silent to keep the
  # aligned layout, and var-or-type is a hint
  - name: CSharpWarnings__CS1591
  - name: CSharpWarnings__CS1573
  - name: BadChildStatementIndent
  - name: SuggestVarOrType_BuiltInTypes
  - name: SuggestVarOrType_Elsewhere
  - name: SuggestVarOrType_SimpleTypes
  - name: MoveLocalFunctionAfterJumpStatement
  - name: PreferConcreteValueOverDefault
  # Solution-wide usage and visibility analysis can't see serialization, DI, reflection or the clients
  # that bind to public contracts
  - name: AutoPropertyCanBeMadeGetOnly.Global
  - name: ClassWithVirtualMembersNeverInherited.Global
  - name: ConvertToConstant.Global
  - name: FieldCanBeMadeReadOnly.Global
  - name: IntroduceOptionalParameters.Global
  - name: MemberCanBeMadeStatic.Global
  - name: MemberCanBePrivate.Global
  - name: MemberCanBeProtected.Global
  - name: NotAccessedField.Global
  - name: NotAccessedPositionalProperty.Global
  - name: PropertyCanBeMadeInitOnly.Global
  - name: UnusedAutoPropertyAccessor.Global
  - name: UnusedMember.Global
  - name: UnusedMemberInSuper.Global
  - name: UnusedMethodReturnValue.Global
  - name: VirtualMemberNeverOverridden.Global
