name: CI

on:
  pull_request:
    # Skip markdown-only PRs, except under kcap/: every file in the shipped plugin is a SKILL.md, so
    # adding a skill is a markdown-only change, and the guard that catches an unlisted skill must
    # run on the PR that adds it. Order matters: later patterns re-include.
    paths:
      - '**'
      - '!**.md'
      - 'kcap/**'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
    tags:
      - 'v*'

# A new commit supersedes an older run for the same PR. Pushes to main and tag builds key on their
# own ref and are never cancelled, so a release build always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Roughly 2.5x the longest observed leg (17m); this only has to catch a wedge, and GitHub's
    # kill takes the uploaded reports with it.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  modules: 3, tests: 4 }
          - { os: getmac,         modules: 3, tests: 4 }
          # Narrower: at three-by-four this leg spent a 20s service-readiness budget and a 1s
          # memory-fetch budget inside the code under test with nothing actually slow.
          - { os: windows-latest, modules: 2, tests: 2 }

    steps:
      - uses: actions/checkout@v7

      # GetMac VMs leave TMPDIR empty, and dotnet's named mutexes then fail on first run. The suite's
      # socket paths need a short, symlink-free root, so not runner.temp.
      - name: Set TMPDIR
        if: runner.os == 'macOS'
        run: '[ -n "${TMPDIR:-}" ] || echo "TMPDIR=/private/tmp" >> "$GITHUB_ENV"'

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
        with:
          cache: true
          # No lock file to key on; CPM makes this the one file that pins every version.
          cache-dependency-path: Directory.Packages.props

      # Whole solution in every cached job: one OS-keyed immutable entry, so a job that
      # restored a subset would win the race and freeze the cache on it.
      - name: Restore solution
        run: dotnet restore Capacitor.slnx

      - name: Build solution
        run: dotnet build Capacitor.slnx --no-restore

      # Plain-Node assertion scripts, no framework or npm install. Bash gives -e on every leg.
      - name: Run npm wrapper tests
        shell: bash
        run: |
          node npm/kcap/bin/kcap.test.js
          node npm/kcap/bin/resolve.test.js
          node npm/kcap/bin/refresh.test.js

      - name: Run shell script tests
        if: runner.os == 'Linux'
        run: bash scripts/run-shell-tests.sh

      # The runner has no user manager until lingering is on, and the local server's live service test
      # needs one to load its unit.
      - name: Start a systemd user session
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          uid=$(id -u)
          for _ in $(seq 30); do [ -S "/run/user/$uid/bus" ] && break; sleep 1; done
          [ -S "/run/user/$uid/bus" ] || { echo "no systemd user bus at /run/user/$uid/bus" >&2; exit 1; }
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"

      - name: Run tests
        env:
          # The live launchd/systemd test loads a uniquely named unit; a disposable runner is the place for it.
          KCAP_LOCAL_SERVICE_CHECK: ${{ runner.os != 'Windows' && '1' || '' }}
        # Assemblies and per-assembly width are per-leg, above: the ceiling is what the runner can
        # carry without the wall-clock budgets inside the code under test expiring. Five modules
        # starved those and vanished an Integration test's temp working directory on Linux, a
        # cross-assembly sharing point no in-assembly [NotInParallel] key can serialise. A keyed
        # [NotInParallel] test still runs concurrently with every disjoint-key class, so anything
        # touching process-global state must hold the same key as every other toucher.
        # --hangdump writes a mini dump after 10m with no test-host activity.
        run: >
          dotnet test --solution Capacitor.slnx --no-build
          --max-parallel-test-modules ${{ matrix.modules }}
          -- --maximum-parallel-tests ${{ matrix.tests }}
          --hangdump --hangdump-timeout 10m --hangdump-type Mini

      # Kept on success too: the console prints nothing between banner and summary, so these are the
      # only per-test timing record. File kinds and not the directory: upload-artifact roots the
      # archive at the common ancestor of its paths, and this also skips the TRX attachment folder,
      # a second copy of the HTML report.
      #
      # continue-on-error: a diagnostic must never decide whether the tests passed. An artifact-service
      # 403 is classed non-retryable, so without this it reddens a run that reported `failed: 0`.
      - name: Upload test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: |
            TestResults/*.html
            TestResults/*.trx
            TestResults/*.tunit-report.json
            TestResults/*.dmp
            TestResults/*hang*
          retention-days: 3
          if-no-files-found: ignore

  lint-linear-ids:
    name: No Linear issue IDs in C# source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for Linear issue ID tokens in src/**/*.cs and test/**/*.cs
        run: bash scripts/check-linear-ids.sh

  # One version for the daemon, the CLI, the app and the package, so the app's CLI floor assertion
  # and Velopack's SemVer check see the same value.
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    env:
      # minver-cli is a framework-dependent global tool built for an older runtime than the pinned SDK.
      DOTNET_ROLL_FORWARD: Major
    steps:
      # Full history and tags: MinVer derives the version from the nearest tag, and a shallow checkout
      # computes a default below the app's CLI floor.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Install minver
        run: dotnet tool install -g minver-cli --version 8.0.0

      # The standalone tool does not read MinVerTagPrefix from Directory.Build.props.
      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          FULL="$(minver --tag-prefix v)"
          echo "VERSION=${FULL%%+*}" >> "$GITHUB_OUTPUT"
          echo "computed $FULL"

  cli:
    name: CLI
    needs: version
    uses: ./.github/workflows/cli-build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      # macOS runners are the org's scarcest pool, so PRs skip the macOS CLI and app. Pushes keep
      # building both, because release waits on the tag's run.
      rids: ${{ github.event_name == 'push' && 'osx-arm64 win-x64 linux-x64' || 'win-x64 linux-x64' }}

  desktop:
    name: Desktop
    needs: [version, cli]
    strategy:
      fail-fast: false
      matrix:
        rid: ${{ github.event_name == 'push' && fromJSON('["osx-arm64","win-x64","linux-x64"]') || fromJSON('["win-x64","linux-x64"]') }}
    uses: ./.github/workflows/desktop.yml
    with:
      rid: ${{ matrix.rid }}
      version: ${{ needs.version.outputs.version }}

  # The one check the release waits on, so renaming or adding a job above never needs a matching
  # change there.
  ci-passed:
    name: CI passed
    if: always()
    needs: [build-and-test, lint-linear-ids, cli, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "::error::a CI job ended $result"; exit 1; }
          done
