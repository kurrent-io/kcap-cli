name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  checks: read
  id-token: write

jobs:
  ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    steps:
      # CI passed exists only once every other CI job has finished, so discovery waits that long.
      - name: Wait for CI workflow to succeed
        uses: lewagon/wait-on-check-action@v1.9.1
        with:
          ref: ${{ github.sha }}
          check-name: CI passed
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15
          checks-discovery-timeout: 7200

  # npm never lets a version republish, so a run for an already-published version means the tag
  # was moved or re-cut. Standalone so it fails in seconds, before CI polling and the builds.
  verify-release-immutable:
    name: Refuse a moved or re-cut release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Refuse to re-publish or re-point an already-released version
        env:
          PKG: '@kurrent/kcap'
          THIS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          status=ok
          published="$(bash scripts/npm-release-commit.sh "$PKG" "$VERSION")" || status=error
          set +e
          verdict="$(bash scripts/verify-release-not-recut.sh "$THIS_SHA" "$published" "$status")"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then echo "No existing $PKG@$VERSION on npm; first publish of this version."; exit 0; fi
          case "$verdict" in
            error)     echo "::error::Could not verify $PKG@$VERSION against npm. Refusing to publish rather than let a moved or re-cut tag through." ;;
            republish) echo "::error::$PKG@$VERSION is already published from this commit, and npm forbids republishing a version. Cut a new version instead of re-running this tag." ;;
            *)         echo "::error::$PKG@$VERSION is already published from commit $published, but tag $GITHUB_REF_NAME points at $THIS_SHA. Cut a new version instead of re-pointing a released tag." ;;
          esac
          exit 1

  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  build:
    name: CLI
    needs: [ci, verify-release-immutable, version]
    uses: ./.github/workflows/cli-build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      rids: osx-arm64 linux-x64 linux-arm64 linux-musl-x64 linux-musl-arm64 win-x64
      sign: true
    secrets: inherit

  publish-npm:
    needs: [build, version]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # npm trusted publishing (OIDC) requires npm >= 11.5.1. Pinned to a known-good npm 11: npm
      # 12.0.0 has a broken bundled sigstore dependency.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.18.0

      - name: Derive npm dist-tag
        id: disttag
        run: echo "TAG=$(bash scripts/npm-dist-tag.sh "$VERSION")" >> "$GITHUB_OUTPUT"

      - name: Download all npm artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: npm-*
          path: npm-artifacts/

      - name: Update package versions and publish platform packages
        run: |
          set -euo pipefail
          for dir in npm-artifacts/npm-kcap-*/; do
            pkg_name=$(basename "$dir" | sed 's/^npm-//')

            # A re-run after a later step failed finds this commit's packages already on npm, and npm
            # refuses to publish a version twice: skip those, refuse one published from another commit.
            published="$(bash scripts/npm-release-commit.sh "@kurrent/$pkg_name" "$VERSION")" \
              || { echo "::error::could not tell whether @kurrent/$pkg_name@$VERSION is published"; exit 1; }
            case "$(bash scripts/verify-release-not-recut.sh "${{ github.sha }}" "$published" || true)" in
              ok) ;;
              republish) echo "@kurrent/$pkg_name@$VERSION is already published from this commit; skipping"; continue ;;
              *) echo "::error::@kurrent/$pkg_name@$VERSION is already published from commit $published"; exit 1 ;;
            esac

            cp "npm/$pkg_name/package.json" "$dir/package.json"
            cp LICENSE.md "$dir/LICENSE.md"

            # The artifact round-trip through ZIP drops the execute bit, and the platform packages
            # have no `bin` field for npm to restore it from. Chosen by file, not package name, so a
            # new RID needs no change here.
            found_cli=false
            for bin in kcap kcap.exe kcap-daemon kcap-daemon.exe; do
              if [ -f "$dir/bin/$bin" ]; then
                chmod +x "$dir/bin/$bin"
                case "$bin" in kcap|kcap.exe) found_cli=true ;; esac
              fi
            done
            if [ "$found_cli" != "true" ]; then
              echo "::error::No kcap binary found in $dir/bin (contents: $(ls "$dir/bin" 2>&1))"
              exit 1
            fi

            cd "$dir"
            npm version "$VERSION" --no-git-tag-version --allow-same-version
            # The commit this package was built from, which the tag guard above checks on every
            # later release of this version.
            npm pkg set kcapReleaseCommit="${{ github.sha }}" kcapReleaseTag="${{ github.ref_name }}"
            npm publish --access public --tag "${{ steps.disttag.outputs.TAG }}"
            cd -
          done

      - name: Update plugin version
        run: |
          node -e "
            const pkg = require('./kcap/.claude-plugin/plugin.json');
            pkg.version = '$VERSION';
            require('fs').writeFileSync('./kcap/.claude-plugin/plugin.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Copy plugin and license into wrapper package
        run: |
          cp -r kcap/ npm/kcap/kcap/
          cp LICENSE.md npm/kcap/LICENSE.md

      # A wrapper installable before its platform packages installs without them, silently: npm
      # skips an optional dependency it cannot resolve.
      - name: Wait for the platform packages to become installable
        run: |
          read -ra pkgs <<< "$(node -p "Object.keys(require('./npm/kcap/package.json').optionalDependencies).join(' ')")"
          bash scripts/wait-npm-available.sh "$VERSION" "${pkgs[@]}"

      - name: Publish wrapper package
        run: |
          cd npm/kcap
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          node -e "
            const pkg = require('./package.json');
            for (const dep of Object.keys(pkg.optionalDependencies || {})) {
              pkg.optionalDependencies[dep] = '$VERSION';
            }
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          npm pkg set kcapReleaseCommit="${{ github.sha }}" kcapReleaseTag="${{ github.ref_name }}"
          npm publish --access public --tag "${{ steps.disttag.outputs.TAG }}"

  github-release:
    needs: [build, version]
    runs-on: ubuntu-latest
    env: &cli-bucket
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2: --endpoint-url ${{ secrets.R2_ENDPOINT }}
      DEST: s3://${{ secrets.R2_BUCKET }}/cli
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # The same rule picks the npm dist-tag, so GitHub and npm agree on what a prerelease is.
      - name: Derive release channel
        id: disttag
        run: echo "TAG=$(bash scripts/npm-dist-tag.sh "$VERSION")" >> "$GITHUB_OUTPUT"

      - name: Download all release archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-artifacts/
          merge-multiple: true

      - name: Build the install manifest
        run: >
          bash scripts/build-cli-manifest.sh "$VERSION" "${{ github.sha }}"
          release-artifacts "${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          > kcap-manifest.json

      # A published manifest vouches for the archives already on this release. Rebuilt archives
      # never match it (signing and archive timestamps), and uploading them would fail every
      # install from that manifest's channels.
      - name: Refuse to replace archives a published manifest covers
        run: |
          set -euo pipefail
          KEY="$VERSION/manifest.json"
          set +e; bash scripts/r2-fetch.sh "$KEY" published.json; rc=$?; set -e
          case "$rc" in
            0)  cmp -s published.json kcap-manifest.json || {
                  echo "::error::cli/$KEY already vouches for other archives of this version. Re-run the failed jobs of the run that published it, or cut a new version."
                  exit 1; } ;;
            44) ;;
            *)  exit 1 ;;
          esac

      - name: Upload the install manifest
        uses: actions/upload-artifact@v7
        with:
          name: cli-manifest
          path: kcap-manifest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-artifacts/*
          generate_release_notes: true
          prerelease: ${{ steps.disttag.outputs.TAG == 'beta' }}

  # The script installer's manifests, served by kcap-web from the bucket's cli/ prefix. The
  # archives stay on the GitHub Release: the checksum and the bytes it covers come from two hosts.
  cli-publish:
    name: Publish the CLI install manifest
    needs: [github-release, version]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Channel promotion is read-compare-write. Without queue: max a second waiting release would
    # cancel the first one's promotion.
    concurrency:
      group: cli-publish
      cancel-in-progress: false
      queue: max
    env: *cli-bucket
    steps:
      - uses: actions/checkout@v7

      - name: Download the install manifest
        uses: actions/download-artifact@v8
        with:
          name: cli-manifest

      # A version's manifest is written once. A re-run finds identical bytes and carries on; a
      # re-cut tag finds different ones and stops before any channel moves.
      - name: Upload the version manifest
        run: |
          set -euo pipefail
          KEY="$VERSION/manifest.json"
          set +e; bash scripts/r2-fetch.sh "$KEY" published.json; rc=$?; set -e
          case "$rc" in
            0)  cmp -s published.json kcap-manifest.json || {
                  echo "::error::cli/$KEY is already published with different contents"; exit 1; } ;;
            44) aws s3 cp $R2 kcap-manifest.json "$DEST/$KEY" \
                  --content-type application/json --cache-control "public, max-age=31536000, immutable" ;;
            *)  exit 1 ;;
          esac

      - name: Promote channels
        run: |
          set -euo pipefail
          current() { # <channel>: the channel's version, empty when it does not exist yet
            local rc; set +e; bash scripts/r2-fetch.sh "channels/$1.json" "current-$1.json"; rc=$?; set -e
            case "$rc" in
              0)  jq -er .version "current-$1.json" ;;
              44) echo "" ;;
              *)  return 1 ;;
            esac
          }
          latest="$(current latest)"; beta="$(current beta)"
          # Assigned first: a failure inside a for loop's word list does not fail the step.
          channels="$(bash scripts/promote-cli-channels.sh "$VERSION" "$latest" "$beta")"
          for channel in $channels; do
            aws s3 cp $R2 kcap-manifest.json "$DEST/channels/$channel.json" \
              --content-type application/json --cache-control "no-cache"
            echo "cli/channels/$channel.json -> $VERSION"
          done

      - name: Attach the manifest to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" kcap-manifest.json --clobber

  app-macos:
    name: Desktop (macOS)
    needs: [build, version]
    uses: ./.github/workflows/desktop.yml
    with:
      rid: osx-arm64
      version: ${{ needs.version.outputs.version }}
      release: true
    secrets: inherit

  app-publish:
    name: Publish the macOS desktop app
    needs: [app-macos, publish-npm, github-release, version]
    uses: ./.github/workflows/publish-desktop.yml
    with:
      version: ${{ needs.version.outputs.version }}
      channel: osx-arm64
      artifact: app-osx-arm64
      npm-platform: darwin-arm64
      installers: .dmg
    secrets: inherit

  app-windows:
    name: Desktop (Windows)
    needs: [build, version]
    uses: ./.github/workflows/desktop.yml
    with:
      rid: win-x64
      version: ${{ needs.version.outputs.version }}
      release: true
    secrets: inherit

  app-publish-windows:
    name: Publish the Windows desktop app
    needs: [app-windows, publish-npm, github-release, version]
    uses: ./.github/workflows/publish-desktop.yml
    with:
      version: ${{ needs.version.outputs.version }}
      channel: win-x64
      artifact: app-win-x64
      npm-platform: win-x64
      installers: -Setup.exe
    secrets: inherit

  app-linux:
    name: Desktop (Linux)
    needs: [build, version]
    uses: ./.github/workflows/desktop.yml
    with:
      rid: linux-x64
      version: ${{ needs.version.outputs.version }}
      release: true
    secrets: inherit

  app-publish-linux:
    name: Publish the Linux desktop app
    needs: [app-linux, publish-npm, github-release, version]
    uses: ./.github/workflows/publish-desktop.yml
    with:
      version: ${{ needs.version.outputs.version }}
      channel: linux-x64
      artifact: app-linux-x64
      npm-platform: linux-x64
      installers: .AppImage .deb
    secrets: inherit

  # The local-edition bundle is built unsigned by kcap-server's local-bundle workflow on the same tag
  # and attached to that tag's kcap-server release. A tarball cannot be stapled: the signed tree is
  # notarized as a zip, so each Mach-O's ticket is found online, and the manifest signature plus its
  # SHA-256 are what the CLI checks before it extracts anything. The win-x64 archive is published with
  # the bytes kcap-server smoke-started; its binaries carry no Authenticode signature until #1391.
  # Every rid the app offers the local edition on needs a leg in both matrices: kcap installs only a
  # bundle whose manifest is published here.
  # No job that holds a signing credential runs code from that release: signing only reads the
  # binaries, the smoke test runs where no secret is, and the manifest is signed on a fresh runner.
  local-manifest-key:
    name: Check the local bundle manifest key
    needs: [ci, verify-release-immutable]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check the manifest signing key
        env:
          LOCAL_BUNDLE_MANIFEST_KEY: ${{ secrets.LOCAL_BUNDLE_MANIFEST_KEY }}
        run: bash scripts/local-manifest-key.sh check src/Capacitor.Cli.Core/Resources/local-bundle-manifest-key.pem

  local-bundle:
    name: Prepare the local bundle (${{ matrix.rid }})
    needs: local-manifest-key
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            runner: macos-latest
            notarize: true
          - rid: win-x64
            runner: ubuntu-latest
            notarize: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The cheap first line of the immutability rule; local-publish repeats it inside its
      # concurrency group against the actual bytes.
      - name: Refuse an already-published version
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2: --endpoint-url ${{ secrets.R2_ENDPOINT }}
          DEST: s3://${{ secrets.R2_BUCKET }}/local/${{ matrix.rid }}
        run: |
          set -euo pipefail
          KEY="kcap-local-${{ steps.version.outputs.VERSION }}-$RID.json"
          set +e; bash scripts/r2-fetch.sh "$KEY" published.json; rc=$?; set -e
          case "$rc" in
            0)  echo "::error::local/$RID/$KEY is already published. A published bundle is never rebuilt: cut a new version."; exit 1 ;;
            44) echo "local/$RID/$KEY is not published yet" ;;
            *)  exit 1 ;;
          esac

      # kcap-server is private. An installation token lasts an hour, which bounds the wait below.
      - name: Get a token that reads kcap-server
        id: server-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.KURRENT_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.KURRENT_CI_APP_PRIVATE_KEY }}
          owner: kurrent-io
          repositories: kcap-server
          permission-contents: read

      - name: Download the unsigned bundle
        id: download
        shell: bash
        env:
          GH_TOKEN: ${{ steps.server-token.outputs.token }}
          SERVER_WAIT_TIMEOUT: 3300
          SERVER_WAIT_INTERVAL: 30
        run: |
          set -euo pipefail
          NAME="kcap-local-${{ steps.version.outputs.VERSION }}-$RID"
          archive="$(bash scripts/wait-server-bundle.sh "$GITHUB_REF_NAME" "$NAME.tar.gz" "$RUNNER_TEMP/unsigned")"
          echo "NAME=$NAME" >> "$GITHUB_OUTPUT"
          echo "ARCHIVE=$archive" >> "$GITHUB_OUTPUT"

      - name: Import signing keychain and notary profile
        if: matrix.notarize
        shell: bash
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: bash scripts/import-signing-keychain.sh

      - name: Sign every Mach-O and re-archive
        if: matrix.notarize
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tree out
          tar -xzf "${{ steps.download.outputs.ARCHIVE }}" -C tree
          bash scripts/sign-local-bundle.sh "${{ secrets.APPLE_SIGNING_IDENTITY }}" "$KEYCHAIN" tree
          bash scripts/verify-local-bundle.sh tree
          # Same root-level layout as the server's archive; no AppleDouble or xattr entries.
          COPYFILE_DISABLE=1 tar --no-xattrs -czf "out/${{ steps.download.outputs.NAME }}.tar.gz" -C tree .

      - name: Notarize the signed tree
        if: matrix.notarize
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --keepParent tree "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --keychain-profile kcap-notary --keychain "$KEYCHAIN" \
            --wait --timeout 45m --output-format json > notary.json || true
          cat notary.json
          id="$(jq -r '.id // empty' notary.json)"
          if [ "$(jq -r '.status // empty' notary.json)" != "Accepted" ]; then
            [ -n "$id" ] && xcrun notarytool log "$id" --keychain-profile kcap-notary --keychain "$KEYCHAIN" || true
            echo "::error::notarization was not accepted"; exit 1
          fi

      # Checks the archive about to be published, not the tree it came from.
      - name: Verify the archive is signed and notarized
        if: matrix.notarize
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p check
          tar -xzf "out/${{ steps.download.outputs.NAME }}.tar.gz" -C check
          bash scripts/verify-local-bundle.sh check
          # Only Apple's ticket lookup is retried: it can lag the accepted submission.
          for attempt in 1 2 3 4 5; do
            bash scripts/verify-local-bundle.sh check --notarized && exit 0
            echo "notarization not visible yet (attempt $attempt)"; sleep 30
          done
          exit 1

      - name: Take the archive as built
        if: ${{ !matrix.notarize }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp "${{ steps.download.outputs.ARCHIVE }}" "out/${{ steps.download.outputs.NAME }}.tar.gz"

      - name: Upload the archive
        uses: actions/upload-artifact@v7
        with:
          name: local-bundle-${{ matrix.rid }}
          path: out/
          if-no-files-found: error

  # The hardened runtime is enforced when the binary runs, not when it is signed, so the smoke test
  # runs the signed archive. Its runner holds only a read token for kcap-server.
  # Each rid publishes on its own: a matrix job's needs wait on every leg, so these gates read the result of the
  # one archive they use, which the download fails on when its leg did not produce it.
  local-smoke:
    name: Smoke-start the signed local bundle (osx-arm64)
    needs: local-bundle
    if: ${{ !cancelled() && needs.local-bundle.result != 'skipped' }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Get a token that reads kcap-server
        id: server-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.KURRENT_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.KURRENT_CI_APP_PRIVATE_KEY }}
          owner: kurrent-io
          repositories: kcap-server
          permission-contents: read

      # The smoke test reads the model pin and its fetch script relative to its own location.
      - name: Fetch the server's smoke test for this tag
        env:
          GH_TOKEN: ${{ steps.server-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/server/scripts" "$RUNNER_TEMP/server/eng"
          for f in scripts/smoke-local-bundle.sh scripts/fetch-embedding-model.sh \
                   eng/builtin-embedding-model.env eng/builtin-embedding-reference.json; do
            gh api -H 'Accept: application/vnd.github.raw' \
              "repos/kurrent-io/kcap-server/contents/$f?ref=$GITHUB_REF_NAME" > "$RUNNER_TEMP/server/$f"
          done

      - name: Download the signed archive
        uses: actions/download-artifact@v8
        with:
          name: local-bundle-osx-arm64
          path: local/

      - name: Smoke-start the signed archive
        shell: bash
        run: bash "$RUNNER_TEMP/server/scripts/smoke-local-bundle.sh" local/kcap-local-*-osx-arm64.tar.gz

  local-publish:
    name: Publish the local bundle (${{ matrix.rid }})
    needs: [local-bundle, local-smoke]
    if: ${{ !cancelled() && needs.local-bundle.result != 'skipped' }}
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, win-x64]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: local-publish-${{ matrix.rid }}
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2: --endpoint-url ${{ secrets.R2_ENDPOINT }}
      DEST: s3://${{ secrets.R2_BUCKET }}/local/${{ matrix.rid }}
      MANIFEST_KEY: src/Capacitor.Cli.Core/Resources/local-bundle-manifest-key.pem
    steps:
      - name: Refuse a macOS bundle the smoke test did not start
        if: matrix.rid == 'osx-arm64' && needs.local-smoke.result != 'success'
        shell: bash
        run: |
          echo "::error::The osx-arm64 smoke test did not pass (${{ needs.local-smoke.result }}); its bundle is not published."
          exit 1

      - uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download the archive
        uses: actions/download-artifact@v8
        with:
          name: local-bundle-${{ matrix.rid }}
          path: local/

      - name: Build and sign the manifest
        env:
          LOCAL_BUNDLE_MANIFEST_KEY: ${{ secrets.LOCAL_BUNDLE_MANIFEST_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          NAME="kcap-local-${{ steps.version.outputs.VERSION }}-${{ matrix.rid }}"
          bash scripts/build-local-manifest.sh "${{ steps.version.outputs.VERSION }}" "${{ matrix.rid }}" "local/$NAME.tar.gz" "$MANIFEST_KEY" > "local/$NAME.json"
          bash scripts/local-manifest-key.sh sign "$MANIFEST_KEY" "local/$NAME.json" "local/$NAME.json.sig"
          cat "local/$NAME.json"

      # Every model object is stored and verified before the manifest that names it is published.
      # Under local/ rather than local/<rid>/: the model set is shared by every rid, so two legs can
      # race to upload one object, whose bytes are pinned by digest either way.
      - name: Upload the built-in model set
        env:
          DEST: s3://${{ secrets.R2_BUCKET }}/local
        run: bash scripts/publish-local-model.sh "local/kcap-local-${{ steps.version.outputs.VERSION }}-${{ matrix.rid }}.tar.gz"

      - name: Upload the archive, signature and manifest
        run: bash scripts/publish-local-bundle.sh local "${{ steps.version.outputs.VERSION }}" "${{ matrix.rid }}" "$MANIFEST_KEY"
